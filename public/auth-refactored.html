<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - AI Study Assistant</title>
    <link rel="stylesheet" href="../auth.css">
</head>
<body>
    <!-- Background Pattern -->
    <div class="background-pattern"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">AI Study Assistant</span>
            </a>
            <a href="../index.html" class="back-home">← Back to Home</a>
        </div>
    </nav>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Tab Switcher -->
            <div class="tab-switcher">
                <button class="tab-btn active" data-tab="login">Login</button>
                <button class="tab-btn" data-tab="register">Register</button>
            </div>

            <!-- Login Form -->
            <div class="form-container active" id="login-form">
                <h2 class="form-title">Welcome Back!</h2>
                <p class="form-subtitle">Login to continue your learning journey</p>

                <form id="loginForm" novalidate>
                    <!-- Email Input -->
                    <div class="input-group">
                        <label for="login-email">Email Address</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input 
                                type="email" 
                                id="login-email" 
                                name="email" 
                                placeholder="Enter your email"
                                required
                            >
                        </div>
                        <span class="error-message" id="login-email-error"></span>
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input 
                                type="password" 
                                id="login-password" 
                                name="password" 
                                placeholder="Enter your password"
                                required
                            >
                            <button type="button" class="toggle-password" data-target="login-password">
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                        <span class="error-message" id="login-password-error"></span>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember-me">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit" id="login-btn">
                        <span class="btn-text">Login</span>
                    </button>
                </form>
            </div>

            <!-- Register Form -->
            <div class="form-container" id="register-form">
                <h2 class="form-title">Create Account</h2>
                <p class="form-subtitle">Start your AI-powered learning journey</p>

                <form id="registerForm" novalidate>
                    <!-- Name Input -->
                    <div class="input-group">
                        <label for="register-name">Full Name</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input 
                                type="text" 
                                id="register-name" 
                                name="name" 
                                placeholder="Enter your full name"
                                required
                            >
                        </div>
                        <span class="error-message" id="register-name-error"></span>
                    </div>

                    <!-- Email Input -->
                    <div class="input-group">
                        <label for="register-email">Email Address</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input 
                                type="email" 
                                id="register-email" 
                                name="email" 
                                placeholder="Enter your email"
                                required
                            >
                        </div>
                        <span class="error-message" id="register-email-error"></span>
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <label for="register-password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input 
                                type="password" 
                                id="register-password" 
                                name="password" 
                                placeholder="Create a password (min 6 characters)"
                                required
                            >
                            <button type="button" class="toggle-password" data-target="register-password">
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                        <span class="error-message" id="register-password-error"></span>
                        <!-- Password Strength Indicator -->
                        <div class="password-strength" id="password-strength">
                            <div class="strength-bar">
                                <div class="strength-fill"></div>
                            </div>
                            <span class="strength-text"></span>
                        </div>
                    </div>

                    <!-- Confirm Password Input -->
                    <div class="input-group">
                        <label for="register-confirm-password">Confirm Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input 
                                type="password" 
                                id="register-confirm-password" 
                                name="confirmPassword" 
                                placeholder="Confirm your password"
                                required
                            >
                            <button type="button" class="toggle-password" data-target="register-confirm-password">
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                        <span class="error-message" id="register-confirm-password-error"></span>
                    </div>

                    <!-- Terms & Conditions -->
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms-checkbox" required>
                            <span>I agree to the <a href="#">Terms & Conditions</a></span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit" id="register-btn">
                        <span class="btn-text">Create Account</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <!-- Refactored Modular Code -->
    <script type="module" src="../src/pages/auth-page.js"></script>
</body>
</html>
