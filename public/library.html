<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library - AI Study Assistant</title>
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>
    <header class="page-header">
        <div class="page-header-inner">
            <div>
                <a href="dashboard.html" class="btn-secondary">← Back to Dashboard</a>
                <h1>Library</h1>
                <p>Browse and search all of your uploaded notes.</p>
            </div>
            <div class="page-actions">
                <span class="user-badge">Signed in as <strong id="user-email">Loading...</strong></span>
                <button class="btn btn-secondary" id="logout-btn">Logout</button>
            </div>
        </div>
    </header>

    <main class="page-content library-page">
        <section class="library-topbar">
            <div>
                <p class="library-label">Your Notes</p>
                <h2>Manage your uploaded study materials</h2>
            </div>
            <div class="library-controls">
                <label class="search-group">
                    <span>Search</span>
                    <input id="searchInput" type="search" placeholder="Search notes by title or filename..." />
                </label>
                <label class="sort-group">
                    <span>Sort by</span>
                    <select id="sortSelect">
                        <option value="latest">Latest upload</option>
                        <option value="oldest">Oldest upload</option>
                    </select>
                </label>
            </div>
        </section>

        <section class="library-summary" id="librarySummary">
            <div class="summary-card">
                <p class="summary-label">Total notes</p>
                <strong id="notesCount">0</strong>
            </div>
            <div class="summary-card soft">
                <p class="summary-label">Tip</p>
                <p>Use the search box to quickly find the note you need.</p>
            </div>
        </section>

        <section id="notesContainer" class="notes-grid"></section>
    </main>

    <div id="summaryModal" class="modal-overlay hidden" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <header class="modal-header">
                <div>
                    <p class="modal-tag">Summary</p>
                    <h3 id="modalTitle">Note summary</h3>
                </div>
                <button class="modal-close" id="closeModal" aria-label="Close summary modal">×</button>
            </header>
            <div class="modal-body" id="modalBody">
                <p>Loading summary…</p>
            </div>
            <footer class="modal-footer">
                <button class="btn-secondary" id="openStudyBtn">Open Study Page</button>
                <button class="btn-primary" id="closeModalFooter">Close</button>
            </footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../src/pages/library-page.js"></script>
</body>
</html>
